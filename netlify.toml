[build]  
  base = "springmart-frontend"  
  command = "npm install && npm run build"  
  publish = "build"  
  
[[redirects]]  
  from = "/*"  
  to = "/index.html"  
  status = 200  
  
[build.environment]  
  NODE_VERSION = "20"  
  NPM_FLAGS = "--legacy-peer-deps" 
  REACT_APP_API_BASE_URL = "https://springmart-backend.onrender.com"
